services:
  - type: web
    name: wealthly-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wealthly-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: wealthly-db
    databaseName: wealthly
    user: wealthly
    region: oregon
    plan: free
