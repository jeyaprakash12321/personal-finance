services:
  - type: web
    name: wealthly-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install -g pnpm@12.4.2 && pnpm install --frozen-lockfile && pnpm --filter api build
    startCommand: pnpm --filter @personal-finance/db migrate && node apps/api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wealthly-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
        # After deploying Next.js to Vercel, set this to your Vercel URL
        # e.g. https://wealthly.vercel.app

databases:
  - name: wealthly-db
    databaseName: wealthly
    user: wealthly
    region: oregon
    plan: free
