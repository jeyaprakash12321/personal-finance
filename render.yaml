services:
  - type: web
    name: wealthly-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: corepack enable && corepack prepare pnpm@12.4.2 --activate && pnpm install --frozen-lockfile && pnpm --filter api build
    startCommand: corepack enable && pnpm --filter @personal-finance/db migrate && node apps/api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wealthly-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
        # Set to your Vercel URL after deploying Next.js, e.g. https://wealthly.vercel.app

databases:
  - name: wealthly-db
    databaseName: wealthly
    user: wealthly
    region: oregon
    plan: free
