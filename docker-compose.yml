services:
  postgres:
    image: postgres:17
    container_name: personal-finance-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: personal_finance

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: